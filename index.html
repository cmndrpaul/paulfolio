<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO and social preview metadata. -->
    <title>Paulfolio | John Paul M. Gonzaga</title>
    <meta name="description" content="John Paul M. Gonzaga is a freelance developer and creator working across web development, graphic design, and video editing." />
    <meta name="author" content="John Paul M. Gonzaga" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0B1E3F" />
    <!-- <link rel="canonical" href="https://yoursite.com/" /> -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- The rail avatar is above the fold on every desktop route. Keep this in
         sync with profile.avatarSrc in src/data/profile.ts. -->
    <link rel="preload" as="image" href="/avatar.svg" fetchpriority="high" media="(min-width: 1100px)" />

    <!-- Open Graph / social share. og:image must be an absolute URL once you deploy. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Paulfolio" />
    <meta property="og:title" content="Paulfolio | John Paul M. Gonzaga" />
    <meta property="og:description" content="Explore John Paul M. Gonzaga's projects in web development, graphic design, and video editing." />
    <meta property="og:image" content="https://raw.githubusercontent.com/cmndrpaul/paulfolio/main/public/thumbnail.jpg.jpg" />
    <meta property="og:image:alt" content="Paulfolio homepage preview" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/cmndrpaul/paulfolio/main/public/thumbnail.jpg.jpg" />

    <!-- Theme before first paint: no flash of the wrong palette. Default is
         light; dark is the visitor's opt-in, persisted in localStorage. -->
    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
